# training.yaml — CTC fine-tuning configuration for FairVoice-Lite

model:
  hf_id: biswa921/wav2vec2-clsril-23-10k-telugu-init
  freeze_feature_extractor: true

output:
  checkpoint_dir: artifacts/checkpoints/wav2vec2_telugu_ctc
  best_model_dir: artifacts/models/wav2vec2_telugu_ctc_best
  robust_model_dir: artifacts/models/wav2vec2_telugu_ctc_robust
  log_dir: logs/

data:
  train_csv: data/metadata/train.csv
  val_csv: data/metadata/validation.csv
  processed_audio_dir: data/processed/

# ── Training hyperparameters (conservative for RTX 4050 6GB) ─────────────────
training:
  num_train_epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 16
  learning_rate: 3.0e-5
  weight_decay: 0.005
  warmup_steps: 100
  lr_scheduler_type: linear

  # Mixed precision
  fp16: true                        # RTX 4050 supports fp16
  fp16_opt_level: O1

  # Gradient checkpointing — DISABLED due to known backward-pass error
  # Enable only after confirming it works in smoke test
  gradient_checkpointing: false

  # Evaluation and saving
  evaluation_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false

  # Logging
  logging_steps: 50
  report_to: none                   # No W&B / MLflow

  # Reproducibility
  seed: 42
  dataloader_num_workers: 0        # Safe for Windows

# ── Smoke test settings ────────────────────────────────────────────────────────
smoke_test:
  num_samples: 16
  num_steps: 5
  batch_size: 2

# ── Noise augmentation (Phase 3: Experiment E5) ──────────────────────────────
noise_augmentation:
  enabled: true
  snr_levels_db: [20, 10, 5, 0]
  noise_type: gaussian
  random_seed: 42
  augment_prob: 0.5                 # 50% of training samples augmented
